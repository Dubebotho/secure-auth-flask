{% extends "base.html" %} {% block content %}

<div class="min-vh-100 d-flex align-items-center justify-content-center px-3">
  <div class="card-custom p-5" style="width: 100%; max-width: 420px">
    <!-- Shield Icon -->
    <div class="text-center mb-4">
      <svg
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#5B6FD4"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </svg>
      <h2 style="font-weight: 700; color: #1a1a2e; margin-top: 12px">
        Sign In
      </h2>
      <p style="color: #6b7280; font-size: 14px">
        Enter your credentials to access your account
      </p>
    </div>

    <!-- Error Message -->
    {% if error %}
    <div class="error-box mb-3">{{ error }}</div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST">
      <div class="mb-3">
        <label style="font-size: 14px; font-weight: 500; color: #1a1a2e"
          >Username</label
        >
        <input
          type="text"
          name="username"
          class="form-control mt-1"
          placeholder="Enter your username"
          required
        />
      </div>
      <div class="mb-4">
        <label style="font-size: 14px; font-weight: 500; color: #1a1a2e"
          >Password</label
        >
        <input
          type="password"
          name="password"
          class="form-control mt-1"
          placeholder="Enter your password"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary-custom w-100">
        Sign In
      </button>
    </form>

    <!-- Links -->
    <div class="text-center mt-4">
      <p style="color: #6b7280; font-size: 14px">
        Don't have an account?
        <a href="/register" class="btn-link-custom">Register</a>
      </p>
      <a href="/validate" class="btn-link-custom" style="font-size: 14px"
        >Validate a Token</a
      >
    </div>
  </div>
</div>

{% endblock %}
